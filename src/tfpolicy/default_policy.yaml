# Default tfpolicy ruleset.
# Each rule can be toggled with `enabled` and re-scored with `severity`
# (fail | warn). Remaining keys are rule-specific options.
version: 1
rules:
  s3_public_access:
    enabled: true
    severity: fail

  sg_open_ingress:
    enabled: true
    severity: fail
    sensitive_ports: [22, 3389, 3306, 5432]

  required_tags:
    enabled: true
    severity: warn
    required: [Project, Owner]
    taggable_types:
      - aws_instance
      - aws_s3_bucket
      - aws_security_group
      - aws_db_instance
      - aws_lb
      - aws_ebs_volume

  iam_wildcard:
    enabled: true
    severity: fail

  instance_type_allowlist:
    enabled: true
    severity: fail
    allowed: [t3.micro, t3.small, t3.medium, t2.micro, t2.small]
