[project]
name = "tfpolicy"
version = "0.1.0"
description = "A Terraform plan policy linter for security and governance rules."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["terraform", "policy", "security", "linter", "devops", "iac"]
dependencies = [
    "PyYAML==6.0.2",
]

[project.scripts]
tfpolicy = "tfpolicy.cli:main"

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.6",
    "mypy==1.14.1",
    "types-PyYAML==6.0.12.20240917",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tfpolicy"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
